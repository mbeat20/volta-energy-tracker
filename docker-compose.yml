services:
  db:
    image: postgres:16
    container_name: volta-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: volta
      POSTGRES_PASSWORD: volta
      POSTGRES_DB: volta
    ports:
      - '5432:5432'
    volumes:
      - volta-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U volta']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  volta-pgdata:
